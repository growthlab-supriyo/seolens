[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seolens"
version = "0.2.0"
description = "Free, open-source SEO crawler and audit tool (up to 10,000 URLs) with a Streamlit dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Supriya Mallick" }]
keywords = ["seo", "crawler", "seo-audit", "technical-seo", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "requests>=2.31,<3",
    "regex>=2023.0",
    "openpyxl>=3.1,<4",
    "pandas>=2,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
js = ["playwright>=1.40,<2"]
dev = ["pytest>=8"]

[project.scripts]
seolens = "seolens.cli:main"

[project.urls]
Homepage = "https://github.com/growthlab-supriyo/seolens"

[tool.setuptools]
packages = ["seolens", "seolens.data"]

[tool.setuptools.package-data]
seolens = ["data/*"]
